name: Sync from baiye-fund

on:
  schedule:
    # 每天 UTC 0:00 运行（北京时间 8:00）
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout HuaHuaDailyMCP
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch latest mcp-server from baiye-fund
        run: |
          # 使用 PAT 访问私有仓库
          git clone --branch main --single-branch \
            https://x-access-token:${{ secrets.SOURCE_TOKEN }}@github.com/baiye1997/baiye-fund.git \
            /tmp/source

      - name: Sync mcp-server files
        run: |
          # 镜像完整运行时目录，并保留公开仓库自己的 Git 元数据与同步 workflow。
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            /tmp/source/mcp-server/ ./

      - name: Check for changes
        id: check_changes
        run: |
          # git diff 不包含新增的未跟踪文件；运行时拆包后必须使用 status 检测。
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git add -A
          git commit -m "chore: sync from baiye-fund/main branch"
          git push
