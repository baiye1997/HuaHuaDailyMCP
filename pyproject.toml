[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huahua-daily"
dynamic = ["version"]
description = "花花日记 MCP Server - 让 OpenClaw 等 AI agent 访问花花日记的数据"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.28,<2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
huahua-daily = "server:main"
huahua = "huahua_mcp_runtime.cli:main"

[tool.setuptools]
py-modules = ["server"]
packages = [
    "huahua_mcp_runtime",
    "huahua_mcp_runtime.tools",
]

[tool.setuptools.dynamic]
version = {attr = "huahua_mcp_runtime.version.__version__"}
